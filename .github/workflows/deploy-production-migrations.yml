name: Deploy reviewed Production migrations

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character commit SHA approved for deployment
        required: true
        type: string
      expected_project_ref:
        description: Confirm the approved Supabase project ref
        required: true
        type: string
      change_ticket:
        description: Approved change-control identifier
        required: true
        type: string
      backup_evidence_id:
        description: Identifier for the independently verified restorable backup
        required: true
        type: string
      confirmation:
        description: Type APPLY REVIEWED MIGRATIONS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-migrations
  cancel-in-progress: false

jobs:
  validate-request:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_PRODUCTION_PROJECT_REF: snmmiwpvlpknkinhfqsv
      GIEOMO_EXPECTED_MIGRATION_TIP: "038"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fail closed on request mismatch
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.expected_sha }}
          INPUT_PROJECT_REF: ${{ inputs.expected_project_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          CHANGE_TICKET: ${{ inputs.change_ticket }}
          BACKUP_EVIDENCE_ID: ${{ inputs.backup_evidence_id }}
        run: |
          set -euo pipefail
          test "$INPUT_SHA" = "$GITHUB_SHA"
          test "$INPUT_PROJECT_REF" = "$EXPECTED_PRODUCTION_PROJECT_REF"
          test "$INPUT_CONFIRMATION" = "APPLY REVIEWED MIGRATIONS"
          test -n "$CHANGE_TICKET"
          test -n "$BACKUP_EVIDENCE_ID"

      - name: Validate canonical migration chain
        run: node scripts/migrations/validate-chain.mjs

  production-preflight:
    needs: validate-request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-readonly
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      EXPECTED_PRODUCTION_PROJECT_REF: snmmiwpvlpknkinhfqsv
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Verify target and available backup evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = "$EXPECTED_PRODUCTION_PROJECT_REF"
          supabase backups list --project-ref "$PROJECT_REF" --output json

      - name: Link exact project and perform migration dry-run
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF"
          supabase migration list --linked
          supabase db push --linked --dry-run

  deploy:
    needs: production-preflight
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      EXPECTED_PRODUCTION_PROJECT_REF: snmmiwpvlpknkinhfqsv
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Apply reviewed migrations and stop on first failure
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = "$EXPECTED_PRODUCTION_PROJECT_REF"
          test "$GITHUB_SHA" = "${{ inputs.expected_sha }}"
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --linked

      - name: Post-deploy catalog checks
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked
          supabase db lint --linked --fail-on error --schema public

